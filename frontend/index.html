<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Validation</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <main class="card-container">
            <form id="validationForm" class="validation-form">
                <h2>System Login</h2>
            
                <div class="form-group">
                    <label for="backendSelect">Target Backend</label>
                    <select id="backendSelect" name="backend">
                        <option value="nodejs" selected>Node.js Server</option>
                        <option value="python">Python Server (Flask)</option>
                        <option value="php">PHP Server</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" id="validateBtn">Validate</button>
            </form>

            <div id="responseContainer" class="response-container hidden">
                <!-- <h3>Server Response:</h3> -->
                <pre id="responseText"></pre>
            </div>
        </main>

        <script src="index.js"></script>
    </body>
</html>
